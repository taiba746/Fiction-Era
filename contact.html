<!DOCTYPE html>
<html>

<head>
  <title>Contact</title>
  <link rel="stylesheet" href="contact.css">
</head>

<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="book.html">Books</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="header-line"></div>

<section class="contact-section">

  <div class="container">

    <h1 class="fiction-heading">Contact Us</h1>

    <p class="subtitle">
      We’d love to hear from our readers ✨
    </p>

    <form>

      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Your Feedback</label>
        <input type="text" id="feedback" placeholder="Feedback">
      </div>

      <div class="input-group">
        <label>Message</label>
        <textarea rows="5" id="message" placeholder="Write your message..."></textarea>
      </div>

      <button type="button" onclick="showData()">
        Send Message
      </button>

    </form>

    <br>

    <p id="nameText"></p>
    <p id="emailText"></p>
    <p id="feedbackText"></p>
    <p id="messageText"></p>

    <h1 class="fiction-heading">THANKS FOR VISITING</h1>

  </div>

</section>

<script>

function showData() {

  let name = document.getElementById("fullname").value;
  let email =document.getElementById("email").value;
  let feedback =document.getElementById("feedback").value;
  let message =document.getElementById("message").value;
  document.getElementById("nameText").textContent =
  "Name: " + name;
  document.getElementById("emailText").textContent =
  "Email: " + email;
  document.getElementById("feedbackText").textContent =
  "Feedback: " + feedback;
  document.getElementById("messageText").textContent =
  "Message: " + message;
}
</script>
</body>
</html>
